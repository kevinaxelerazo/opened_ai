    cmd: >-
      C:\ik_llama.cpp\llama-server.exe
      -m "B:\develop\LLAMA.CPP_IA_LOCAL\modelos\Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ3_M.gguf"
      --mmproj "B:\develop\LLAMA.CPP_IA_LOCAL\modelos\mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf"
      -ngl 99
