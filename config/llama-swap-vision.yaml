# =====================================================================
# Configuración de Producción: llama-swap para ik_llama.cpp
# Hardware: RTX 3060 Ti 8GB (ReBAR 8192 MiB) + 32GB DDR4 3200MHz + i7-9700 AVX2
# Optimización: Split Vertical (-ot) -> 42/42 Capas de Atención en VRAM + 32K KV Cache
#               Expertos FFN superiores en CUDA_Host DMA Pinned RAM (+81% velocidad: ~26 t/s)
# Puerto proxy: 8080 (accesible en localhost, LAN 192.168.18.10 y Tailscale)
# =====================================================================

models:
  # ⚡ Modelo 1: Qwen 3.8 Distill Uncensored (APEX 3-bit) - 32K Contexto + Split Vertical
  qwen38-uncensored:
    cmd: >-
      C:\ik_llama.cpp\llama-server.exe
      -m "B:\develop\LLAMA.CPP_IA_LOCAL\modelos\Qwen3.8-35B-A3B-Distill.APEX-I-MiniPlus-V2.1-Abliterated.gguf"
      -ngl 99
      -ot "blk[.](1[8-9]|[2-4][0-9])[.]ffn_.*_exps[.]weight=CPU"
      -c 32768
      -t 8
      -fa on
      -ctk q8_0
      -ctv q4_0
      --context-shift on
      --slot-save-path "B:\develop\LLAMA.CPP_IA_LOCAL\slots"
      --reasoning on
      --reasoning-budget 2048
      --reasoning-format deepseek
      --jinja
      --port ${PORT}
      --host 127.0.0.1

  # ⭐ Modelo 2: Qwen 3.8 Distill MoE (IQ3_M) - 32K Contexto + Split Vertical (~26.1 t/s)
  qwen38-distill:
    cmd: >-
      C:\ik_llama.cpp\llama-server.exe
      -m "B:\develop\LLAMA.CPP_IA_LOCAL\modelos\Qwen3.8-35B-A3B-IQ3_M.gguf"
      -ngl 99
      -ot "blk[.](1[6-9]|[2-4][0-9])[.]ffn_.*_exps[.]weight=CPU"
