      --slot-save-path "B:\develop\LLAMA.CPP_IA_LOCAL\slots"
      --reasoning on
      --reasoning-budget 512
      --reasoning-format deepseek
      --jinja
      --port ${PORT}
      --host 127.0.0.1

  # 🏛️ Modelo 3: Qwen 3.6 Nativo IQ3_M imatrix (Compilación artesanal local) - 32K + Split Vertical
