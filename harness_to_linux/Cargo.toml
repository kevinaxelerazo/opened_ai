[package]
name = "opened-ai"
version = "0.1.0"
edition = "2021"
authors = ["Axel Homelab"]
description = "Opened-AI: Ultra-lightweight Rust Agentic Harness for Local MoE LLMs (ik_llama.cpp + llama-swap) with Full Agent Control"

[[bin]]
name = "oai"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
regex = "1.11"
base64 = "0.22"
walkdir = "2.5"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

